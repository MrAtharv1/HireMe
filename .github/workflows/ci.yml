name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ai_job_platform
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai_job_platform/requirements.txt'

      - name: Set up Node.js 18 (for Demo Fixture Testing)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_job_platform/requirements.txt
          pip install pytest pytest-asyncio pytest-cov anyio

      - name: Run Pytest Test Suite
        working-directory: ./ai_job_platform
        run: |
          python -m pytest tests -v

  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'frontend_job/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend_job
        run: |
          npm ci || npm install

      - name: Build Frontend Application
        working-directory: ./frontend_job
        run: |
          npm run build
