<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Card -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="3" y="3" width="58" height="58" rx="17" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Inner Soft Glow Ring -->
  <rect x="6" y="6" width="52" height="52" rx="14" stroke="url(#accentGrad)" stroke-opacity="0.15" stroke-width="1" />

  <!-- Modern "H" Monogram with Career Bridge -->
  <!-- Left Column -->
  <rect x="17" y="16" width="7" height="32" rx="3.5" fill="#ffffff" />
  <!-- Right Column -->
  <rect x="40" y="16" width="7" height="32" rx="3.5" fill="#ffffff" />
  <!-- Horizontal Bridge with Launch Arrow Angle -->
  <path d="M21 32h22" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Core AI Sparkle Star (✦) Top Right -->
  <path d="M46 10 C46 14.5 43.5 17 39 17 C43.5 17 46 19.5 46 24 C46 19.5 48.5 17 53 17 C48.5 17 46 14.5 46 10 Z" fill="url(#goldSpark)" />
  <circle cx="46" cy="17" r="1.5" fill="#ffffff" />

  <!-- Micro Sparkle Bottom Left -->
  <circle cx="16" cy="46" r="2" fill="#34d399" />
</svg>
