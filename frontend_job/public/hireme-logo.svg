<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="logoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#logoBg)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="15" y="13" width="6.5" height="30" rx="3.25" fill="#ffffff" />
    <rect x="34.5" y="13" width="6.5" height="30" rx="3.25" fill="#ffffff" />
    <path d="M19 28h18" stroke="url(#logoEmerald)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M41 8 C41 12 38.5 14.5 34.5 14.5 C38.5 14.5 41 17 41 21 C41 17 43.5 14.5 47.5 14.5 C43.5 14.5 41 12 41 8 Z" fill="url(#sparkGold)" />
    <circle cx="41" cy="14.5" r="1.2" fill="#ffffff" />
    <circle cx="14" cy="41" r="1.8" fill="#34d399" />
  </g>

  <!-- Wordmark "HireMe" -->
  <text x="72" y="39" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">
    HireMe
  </text>

  <!-- "AI" Badge Pill -->
  <g transform="translate(182, 16)">
    <rect x="0" y="0" width="46" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" />
    <text x="23" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="0.5">
      AI
    </text>
  </g>

  <!-- Subtle Subtitle Tag -->
  <text x="73" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1.2" text-transform="uppercase" fill="#94a3b8">
    CAREER &amp; RESUME ACCELERATOR
  </text>
</svg>
